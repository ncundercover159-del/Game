# "Snak" — free conversation where the player builds replies from scratch
# (typing, or tapping words from the word bank of everything they've met).
#
# Offline engine: each turn has an NPC question and accepted answer patterns.
# Pattern syntax (matched against the lower-cased answer with punctuation removed):
#   word          literal word
#   (a|b)         one of
#   [a] / [a|b]   optional
#   {slot}        one word from slots.<slot>; {any} = any single word
#   *             any number of words (for open-ended answers)
# `react` is what the NPC says after an accepted answer ({1} = first captured slot is NOT
# substituted — reactions are pre-voiced, so keep them generic).
# Topic lines are voiced by the topic's NPC; model answers by the player's voice.
# With an API key set in Settings, the game can instead generate open conversation
# (see src/talk/ai.ts); this file stays the offline, always-available fallback.

slots:
  num: [nul, en, et, to, tre, fire, fem, seks, syv, otte, ni, ti, elleve, tolv, tretten, fjorten, femten, seksten, sytten, atten, nitten, tyve]
  ordinal: [første, anden, tredje, fjerde, femte]
  feeling: [godt, fint, okay, super, dårligt]

# Mistakes English speakers typically make, checked before matching.
# `re` is a JavaScript regex tested against the normalised answer.
coach:
  - re: "^jeg er fin"
    why: "'Jeg er fin' means 'I'm posh / dressed up'. Say 'Det går godt' or 'Fint, tak'."
    fix: Det går godt, tak.
  - re: "\\btak meget\\b"
    why: "'Tak meget' isn't Danish. Say 'mange tak' or 'tusind tak'."
    fix: Tusind tak.
  - re: "^(ja|nej) (jeg|du|vi) (er|har|kan|gør)( ikke)?$"
    why: "Short answers need 'det' and the verb before the subject: 'Ja, det er jeg' / 'Nej, det har jeg ikke'."
  - re: "^min navn\\b"
    why: "'navn' is an et-word, so it's 'mit navn'. Most Danes just say 'Jeg hedder …'."
  - re: "^(nu|her|så|først|altid|tit|i dag|i morgen|i aften) (jeg|du|han|hun|vi|de|den|det) [a-zæøå]+"
    why: "Verb second! When you start with a word like 'nu' or 'i morgen', the verb comes next, then the subject: 'I morgen viser jeg …'."
  - re: "^(jeg|du|han|hun|vi|de|den|det) ikke [a-zæøå]+"
    why: "'ikke' goes after the verb: 'Jeg drikker ikke kaffe', not 'Jeg ikke drikker'."
  - re: "^(hvor|hvad|hvordan|hvem) (jeg|du|han|hun|vi|de) [a-zæøå]+"
    why: "After a question word the verb comes first, then the subject: 'Hvor bor du?'."
  - re: "^(jeg|du|vi) (er|bor) fra\\b"
    why: "It's 'Jeg kommer fra …' or 'Jeg er fra …' — not 'bor fra'."

  - re: "^giv mig\\b"
    why: "Too blunt for a shop or café. Say 'Jeg vil gerne have …' or '… tak'."
    fix: Jeg vil gerne have et rundstykke.
  - re: "\\b(en|den) (stort|store) (kaffe|kage|latte)\\b|\\bet stor\\b"
    why: "Adjectives agree: en stor kaffe, et stort glas, to store kager."
  - re: "^nej$"
    why: "A bare 'nej' sounds rude. Add 'tak' (Nej tak) or a reason: 'Jeg kan desværre ikke'."
    fix: Nej tak.
  - re: "^jeg (har|er) (u)?enig$|^jeg har (u)?enig\\b"
    why: "'enig' is an adjective: 'Jeg er enig' / 'Jeg er ikke enig'."
    fix: Jeg er enig.
  - re: "\\b(i sidste weekend|i går)\\b.*\\bjeg (skal|går|er|laver)\\b|^jeg (skal|går|laver) .*\\b(i sidste weekend|i går)\\b"
    why: "Finished time needs the past tense: 'I går var jeg …', 'I sidste weekend gik jeg …'."
  - re: "^(fordi|hvis|når|at) (jeg|du|han|hun|vi|de|det) [a-zæøå]+ ikke\\b"
    why: "In a sub-clause, 'ikke' goes BEFORE the verb: 'fordi jeg ikke gider', not 'fordi jeg gider ikke'."
  - re: "^(hvis|når|da) .+ (jeg|du|vi|de|han|hun|det) (kan|skal|vil|er|har|går|kommer|bliver)\\b"
    why: "After a hvis/når/da part, the verb comes first: 'Hvis det regner, bliver vi hjemme'."

turns:
  name:
    ch: 1
    hint: "Tell them your name (Jeg hedder …)."
    ask: { da: "Hvad hedder du?", en: "What's your name?" }
    accept:
      - { p: "[jeg hedder] {any}" }
      - { p: "mit navn er {any}" }
    react: { da: "Hyggeligt at møde dig.", en: "Nice to meet you." }
    model: [{ da: "Jeg hedder {name}.", en: "My name's {name}." }]
  from:
    ch: 1
    hint: "Say where you're from (Jeg kommer fra …)."
    ask: { da: "Hvor kommer du fra?", en: "Where are you from?" }
    accept:
      - { p: "[jeg kommer] fra {any}" }
      - { p: "jeg er fra {any}" }
    react: { da: "Nå, spændende!", en: "Oh, exciting!" }
    model: [{ da: "Jeg kommer fra England.", en: "I'm from England." }]
  how:
    ch: 1
    hint: "Say how it's going (Det går …)."
    ask: { da: "Hvordan går det?", en: "How's it going?" }
    accept:
      - { p: "[det går] {feeling} [tak] [og|hvad] [med] [dig]" }
      - { p: "[det går] {feeling} [tak] [og] [selv]" }
      - { p: "ikke så godt", react: { da: "Åh nej. Det er jeg ked af at høre.", en: "Oh no. I'm sorry to hear that." } }
    react: { da: "Hvor dejligt.", en: "How lovely." }
    model: [{ da: "Det går godt, tak.", en: "Good, thanks." }, { da: "Fint. Hvad med dig?", en: "Fine. How about you?" }]
  live:
    ch: 1
    hint: "Say which floor you live on (Jeg bor på … sal)."
    ask: { da: "Hvor bor du henne?", en: "Where do you live?", say: "'henne' is often added to 'hvor': 'vor bor du HEN-neh?'" }
    accept:
      - { p: "[jeg bor] på {ordinal} [sal] [til] [venstre|højre]" }
      - { p: "[jeg bor] (her|i aarhus|i opgangen)" }
    react: { da: "Nå, okay.", en: "Oh, okay." }
    model: [{ da: "Jeg bor på tredje sal.", en: "I live on the third floor." }]
  bike:
    ch: 1
    hint: "Answer yes or no, in a full Danish short answer."
    ask: { da: "Har du en cykel?", en: "Do you have a bike?" }
    accept:
      - { p: "ja [det har jeg]" }
      - { p: "nej [det har jeg ikke]" }
      - { p: "nej ikke endnu" }
      - { p: "(ja|nej) jeg har [ikke] en cykel" }
      - { p: "ja jeg låner [en|mads'|mads] [cykel]" }
    react: { da: "Okay.", en: "Okay." }
    model: [{ da: "Nej, det har jeg ikke.", en: "No, I don't." }, { da: "Ja, det har jeg.", en: "Yes, I do." }]
  number:
    ch: 1
    hint: "Give a phone number in pairs, e.g. tyve tolv nitten fjorten."
    ask: { da: "Hvad er dit nummer?", en: "What's your number?" }
    accept:
      - { p: "[det er|mit nummer er] {num} {num} {num} {num}" }
    react: { da: "Tak. Nu har jeg det.", en: "Thanks. Now I've got it." }
    model: [{ da: "Det er tyve, tolv, nitten, fjorten.", en: "It's 20 12 19 14." }]
  coffee:
    ch: 1
    hint: "Say yes or no, politely."
    ask: { da: "Vil du have en kop kaffe?", en: "Would you like a cup of coffee?" }
    accept:
      - { p: "ja [tak]" }
      - { p: "ja gerne" }
      - { p: "ja det vil jeg gerne [have]" }
      - { p: "ja tak det vil jeg gerne [have]" }
      - { p: "nej tak", react: { da: "Okay. Så en kop te?", en: "Okay. A cup of tea, then?" } }
      - { p: "nej [tak] jeg drikker ikke kaffe", react: { da: "Okay. Så en kop te?", en: "Okay. A cup of tea, then?" } }
    react: { da: "Værsgo.", en: "Here you go." }
    model: [{ da: "Ja tak, det vil jeg gerne.", en: "Yes please, I'd love one." }]
  aarhus:
    ch: 1
    hint: "Say whether you like Aarhus (Ja, det kan jeg godt lide)."
    ask: { da: "Kan du lide Aarhus?", en: "Do you like Aarhus?", say: "'lide' is 'LEE' — the d is silent." }
    accept:
      - { p: "ja [det kan jeg] [godt] [lide] [meget]" }
      - { p: "ja jeg elsker (aarhus|det|den)" }
      - { p: "ja jeg kan [godt] lide aarhus" }
      - { p: "ja meget" }
      - { p: "nej ikke så meget", react: { da: "Nå? Det bliver bedre.", en: "Oh? It'll get better." } }
    react: { da: "Det er jeg glad for at høre.", en: "I'm glad to hear that." }
    model: [{ da: "Ja, det kan jeg godt lide.", en: "Yes, I like it." }]
  doing:
    ch: 1
    hint: "Say what you're doing in Aarhus (Jeg skal arbejde / læse her)."
    ask: { da: "Hvad laver du i Aarhus?", en: "What are you doing in Aarhus?" }
    accept:
      - { p: "jeg (skal|vil) (arbejde|læse|studere) [her] [i aarhus]" }
      - { p: "jeg (arbejder|læser|studerer) [her] [i aarhus]" }
    react: { da: "Hvor spændende!", en: "How exciting!" }
    model: [{ da: "Jeg skal arbejde her.", en: "I'm going to work here." }]

  order_bakery:
    ch: 2
    hint: "Order something (Jeg vil gerne have …)."
    ask: { da: "Hvad skulle det være?", en: "What can I get you?" }
    accept:
      - { p: "[jeg vil gerne have] {num} {any} [tak]" }
      - { p: "[jeg vil gerne have] (en|et) {any} [tak]" }
      - { p: "{any} {any} tak" }
    react: { da: "Et øjeblik.", en: "One moment." }
    model: [{ da: "Jeg vil gerne have to rundstykker.", en: "I'd like two bread rolls, please." }]
  anything_else:
    ch: 2
    hint: "Say no thanks, that's all — or order one more thing."
    ask: { da: "Ellers andet?", en: "Anything else?" }
    accept:
      - { p: "nej tak [det var det]" }
      - { p: "nej det var det [tak]" }
      - { p: "ja [tak] [gerne] (en|et|to) *" }
    react: { da: "Så er det klaret.", en: "That's that, then." }
    model: [{ da: "Nej tak, det var det.", en: "No thanks, that's all." }]
  pay:
    ch: 2
    hint: "Say how you'll pay (med kort / med MobilePay / kontant)."
    ask: { da: "Hvordan vil du betale?", en: "How would you like to pay?" }
    accept:
      - { p: "[med] (mobilepay|kort) [tak]" }
      - { p: "kontant [tak]" }
      - { p: "jeg vil [gerne] betale (med mobilepay|med kort|kontant)" }
    react: { da: "Værsgo.", en: "Here you go." }
    model: [{ da: "Med MobilePay.", en: "With MobilePay." }]
  size:
    ch: 2
    hint: "Choose a size (en stor / en lille)."
    ask: { da: "Vil du have en stor eller en lille kaffe?", en: "Would you like a large or a small coffee?" }
    accept:
      - { p: "[en] (stor|lille) [kaffe] [tak]" }
      - { p: "jeg vil gerne have en (stor|lille) [kaffe] [tak]" }
    react: { da: "Det kommer.", en: "Coming up." }
    model: [{ da: "En stor, tak.", en: "A large one, please." }]
  stay:
    ch: 2
    hint: "Say whether it's to take away or to have here."
    ask: { da: "Til at tage med, eller sidder du her?", en: "To take away, or are you sitting in?" }
    accept:
      - { p: "(her|til at tage med) [tak]" }
      - { p: "jeg sidder her [tak]" }
      - { p: "jeg tager den med [tak]" }
    react: { da: "Okay.", en: "Okay." }
    model: [{ da: "Her, tak.", en: "Here, please." }]
  where_to:
    ch: 3
    hint: "Say where you're going (Jeg skal til …)."
    ask: { da: "Hvor skal du hen?", en: "Where are you going?" }
    accept:
      - { p: "[jeg skal] (til|hen til|ind til|hjem) *" }
      - { p: "[jeg skal] hjem" }
    react: { da: "Tag letbanen. Det er nemmest.", en: "Take the tram. It's easiest." }
    model: [{ da: "Jeg skal til Dokk1.", en: "I'm going to Dokk1." }]
  time:
    ch: 3
    hint: "Tell the time (Den er halv tre / kvart over to)."
    ask: { da: "Ved du, hvad klokken er?", en: "Do you know what time it is?", lx: { ved: vide } }
    accept:
      - { p: "[ja] [den er|klokken er] (halv|kvart over|kvart i) {num}" }
      - { p: "[ja] [den er|klokken er] {num} [minutter] (over|i) [halv] {num}" }
      - { p: "[ja] [den er|klokken er] {num}" }
      - { p: "nej desværre" }
    react: { da: "Tak!", en: "Thanks!" }
    model: [{ da: "Ja, den er halv tre.", en: "Yes, it's half past two." }]
  weather:
    ch: 5
    hint: "Say something about the weather (Det regner / Det er koldt)."
    ask: { da: "Sikke et vejr, hva'?", en: "What weather, eh?" }
    accept:
      - { p: "[ja] [det] (regner|blæser|sner) *" }
      - { p: "[ja] det er (koldt|varmt|dejligt|skønt|typisk|grimt) *" }
      - { p: "ja *" }
    react: { da: "Typisk dansk vejr.", en: "Typical Danish weather." }
    model: [{ da: "Ja, det regner hele tiden!", en: "Yes, it rains all the time!" }]
  weekend:
    ch: 5
    hint: "Say what you're doing this weekend (Jeg skal …)."
    ask: { da: "Hvad skal du lave i weekenden?", en: "What are you doing this weekend?" }
    accept:
      - { p: "jeg skal *" }
      - { p: "ikke (så|noget) *" }
      - { p: "det ved jeg ikke *" }
    react: { da: "Det lyder hyggeligt.", en: "That sounds nice." }
    model: [{ da: "Jeg skal til fødselsdag.", en: "I'm going to a birthday party." }]
  weekend_past:
    ch: 5
    hint: "Say what you did last weekend — past tense! (Jeg var … / Jeg gik …)"
    ask: { da: "Hvad lavede du i sidste weekend?", en: "What did you do last weekend?" }
    accept:
      - { p: "[i sidste weekend] [jeg] (var|gik|så|spiste|besøgte|tog|cyklede|arbejdede|sov|læste|lavede|slappede|drak|mødte) *" }
      - { p: "ikke (så|noget) *" }
    react: { da: "Nå, fedt.", en: "Oh, nice." }
    model: [{ da: "Jeg var på ARoS.", en: "I went to ARoS." }]
  meet_friday:
    ch: 6
    hint: "Accept or politely decline (Ja, gerne / Jeg kan desværre ikke)."
    ask: { da: "Skal vi ses på fredag?", en: "Shall we meet up on Friday?" }
    accept:
      - { p: "ja [tak] [gerne] *" }
      - { p: "gerne *" }
      - { p: "(det kan jeg|jeg kan) desværre ikke *", react: { da: "Øv! En anden gang så.", en: "Aw! Another time, then." } }
    react: { da: "Fedt! Jeg glæder mig.", en: "Great! I'm looking forward to it." }
    model: [{ da: "Ja, gerne! Hvor skal vi mødes?", en: "Yes, I'd love to! Where shall we meet?" }]
  symptom:
    ch: 7
    hint: "Say what's wrong (Jeg har ondt i … / Jeg har feber)."
    ask: { da: "Hvad kan jeg gøre for dig?", en: "What can I do for you?" }
    accept:
      - { p: "jeg har ondt i *" }
      - { p: "jeg har (feber|hovedpine|det skidt|influenza) *" }
      - { p: "jeg (hoster|er syg|føler mig syg) *" }
    react: { da: "Lad mig lige kigge på det.", en: "Let me just have a look." }
    model: [{ da: "Jeg har ondt i halsen.", en: "I have a sore throat." }]
  how_long:
    ch: 7
    hint: "Say how long you've had it (I tre dage / Siden i går)."
    ask: { da: "Hvor længe har du haft det?", en: "How long have you had it?" }
    accept:
      - { p: "[jeg har haft det] (i|siden) *" }
      - { p: "[i] (en|et|to|tre|fire|fem) (dag|dage|uge|uger) *" }
    react: { da: "Okay. Det er godt, du kom.", en: "Okay. Good that you came." }
    model: [{ da: "I tre dage.", en: "For three days." }]
  taste:
    ch: 8
    hint: "Say how the food tastes (Det smager …)."
    ask: { da: "Hvordan smager det?", en: "How does it taste?" }
    accept:
      - { p: "[det smager|det er] [rigtig|virkelig|meget|super] (godt|lækkert|dejligt|fantastisk) *" }
      - { p: "(lækkert|dejligt|fantastisk) *" }
    react: { da: "Tak, det er jeg glad for.", en: "Thanks, I'm glad." }
    model: [{ da: "Det smager virkelig godt.", en: "It tastes really good." }]
  more:
    ch: 8
    hint: "Accept or decline more food — always with 'tak'."
    ask: { da: "Vil du have lidt mere?", en: "Would you like a bit more?" }
    accept:
      - { p: "ja tak [gerne] *" }
      - { p: "nej tak *" }
    react: { da: "Værsgo.", en: "Here you go." }
    model: [{ da: "Nej tak, jeg er mæt.", en: "No thanks, I'm full." }]
  after_meal:
    ch: 8
    hint: "The meal is over. What do you always say to the host?"
    ask: { da: "Nå, er alle færdige?", en: "So, is everyone finished?" }
    accept:
      - { p: "[ja] tak for mad *" }
    react: { da: "Velbekomme!", en: "You're very welcome!" }
    model: [{ da: "Ja, tak for mad!", en: "Yes, thanks for the meal!" }]
  opinion:
    ch: 9
    hint: "Give your opinion (Jeg synes, at … / Jeg er enig / Det kommer an på …)."
    ask: { da: "Hvad synes du om en firedages arbejdsuge?", en: "What do you think about a four-day working week?" }
    accept:
      - { p: "jeg synes [ikke] [at] *" }
      - { p: "jeg er [ikke] [helt] (enig|uenig) *" }
      - { p: "det kommer an på *" }
      - { p: "på den ene side *" }
      - { p: "jeg tror [ikke] [at] *" }
    react: { da: "Interessant. Det har du nok ret i.", en: "Interesting. You're probably right." }
    model: [{ da: "Jeg synes, det er en god idé.", en: "I think it's a good idea." }]
  herring:
    ch: 10
    hint: "Say whether you've tried herring (Ja, … / Nej, aldrig …)."
    ask: { da: "Har du prøvet sild før?", en: "Have you tried herring before?" }
    accept:
      - { p: "(ja|nej) *" }
      - { p: "aldrig *" }
    react: { da: "Skål på det!", en: "Cheers to that!" }
    model: [{ da: "Nej, aldrig. Hvordan smager det?", en: "No, never. What does it taste like?" }]

