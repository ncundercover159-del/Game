# Shared lexicon. Every word in every sentence links here (the compiler fails on unknown words).
#
# id:     the lemma (dictionary form). Add "#tag" to split homographs, e.g. "så#adv".
# pos:    noun verb adj adv pron prep conj interj num art name phrase part
# g:      en / et (nouns)
# forms:  nouns   def (the …), pl, defpl
#         verbs   inf, pres, past, perf (participle), imp; `aux: er` if the perfect uses "er"
#         adj     t (et-form), e (plural/definite), comp, sup
#         pron    obj, poss, et, pl
#         Spoken spellings (hva', ik') go in `also`.
# rank:   approximate frequency rank (1 = most common), from general Danish frequency lists.
#         Used to check that A1 content introduces common words first.
# say:    how it's really pronounced, in English-friendly respelling.
# Phrases (pos: phrase) are matched across tokens and shown alongside the single word.

ambiguous:
  en: "en#art"
  et: "en#art"
  så: "så#adv"
  svar: svar
  svaret: svar
  hygge: "hygge#noun"
  lidt: lidt

