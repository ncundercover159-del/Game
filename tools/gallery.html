<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rōnin no Sato: art gallery</title>
<style>
  body { margin: 0; padding: 16px; background: #241c30; color: #f6efe6; font: 13px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 14px; margin: 18px 0 6px; color: #efcd8f; }
  p { margin: 0 0 12px; color: #bdb4c4; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .cell { background: #3a3048; padding: 6px; border-radius: 3px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .cell canvas { image-rendering: pixelated; background: #288a1c; }
  .cell .one { background: #3a3048; }
  .cell span { font-size: 10px; color: #bdb4c4; max-width: 180px; word-break: break-all; text-align: center; }
  .pal { display: flex; flex-wrap: wrap; gap: 4px; }
  .sw { width: 64px; font-size: 10px; text-align: center; }
  .sw div { height: 24px; border-radius: 2px; }
</style>
</head>
<body>
<h1>Rōnin no Sato: art gallery</h1>
<p>Every palette colour, atlas frame and autotile case, at 1x and 4x. Generated live from <code>src/art</code>.</p>
<div id="root"></div>
<script type="module" src="./gallery.js"></script>
</body>
</html>
